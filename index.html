<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Calculator</title>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --header-bg: #eddfe0;
      --card-bg: #ffffff;
      --text-color: #000000;
      --bubble-me: #95ec69;
      --bubble-other: #ffffff;
      --input-bg: #f7f7f7;
      --border-color: #e5e5ea;
    }

    [data-theme="dark"] {
      --bg-color: #111111;
      --header-bg: #1e1e1e;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --bubble-me: #26b342;
      --bubble-other: #2c2c2e;
      --input-bg: #1c1c1e;
      --border-color: #38383a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); }

    /* ================= 1. 计算器伪装界面 ================= */
    #calc-app {
      display: flex; flex-direction: column; height: 100vh; background: #000; color: #fff; justify-content: flex-end; padding: 20px;
    }
    .calc-screen { font-size: 64px; text-align: right; margin-bottom: 20px; padding: 0 10px; font-weight: 300; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .calc-btn {
      width: 100%; aspect-ratio: 1; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; color: #fff; background: #333; display: flex; align-items: center; justify-content: center;
    }
    .calc-btn.op { background: #ff9f0a; }
    .calc-btn.top { background: #a5a5a5; color: #000; }
    .calc-btn.zero { grid-column: span 2; border-radius: 40px; justify-content: flex-start; padding-left: 28px; }

    /* ================= 2. 聊天主界面 (iOS 微信风) ================= */
    #chat-app { display: none; flex-direction: column; height: 100vh; background-color: var(--bg-color); }
    
    /* 导航栏 */
    .header {
      height: 44px; background: var(--header-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 0.5px solid var(--border-color); font-weight: 600; font-size: 17px;
    }
    .status-subtitle { font-size: 11px; font-weight: normal; color: #8e8e93; text-align: center; }

    /* 消息区 */
    .chat-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .msg-row { display: flex; align-items: flex-start; gap: 8px; max-width: 80%; }
    .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 38px; height: 38px; border-radius: 6px; background: #ccc; flex-shrink: 0; background-size: cover; }
    .bubble {
      padding: 10px 14px; border-radius: 8px; font-size: 16px; line-height: 1.4; background-color: var(--bubble-other); color: var(--text-color); position: relative; word-break: break-word; user-select: none;
    }
    .msg-row.me .bubble { background-color: var(--bubble-me); }
    .bubble img { max-width: 180px; border-radius: 6px; display: block; }
    .system-msg { align-self: center; font-size: 12px; color: #8e8e93; margin: 4px 0; }

    /* 输入栏 */
    .input-bar {
      min-height: 50px; background: var(--header-bg); border-top: 0.5px solid var(--border-color); display: flex; align-items: center; padding: 8px 12px; gap: 8px;
    }
    .input-box { flex: 1; background: var(--card-bg); border-radius: 6px; border: none; outline: none; padding: 8px 12px; font-size: 16px; color: var(--text-color); }
    .icon-btn { font-size: 24px; cursor: pointer; background: none; border: none; }

    /* 表情面板 */
    #emoji-panel { display: none; height: 180px; background: var(--header-bg); border-top: 0.5px solid var(--border-color); padding: 12px; grid-template-columns: repeat(7, 1fr); gap: 10px; overflow-y: auto; }
    .emoji-item { font-size: 24px; text-align: center; cursor: pointer; }

    /* 长按菜单 */
    #context-menu {
      display: none; position: absolute; background: rgba(0,0,0,0.8); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 14px; z-index: 100; cursor: pointer;
    }

    /* 模拟更新弹窗 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 200; }
    .ios-alert { width: 270px; background: var(--card-bg); border-radius: 14px; text-align: center; overflow: hidden; }
    .ios-alert-title { font-weight: 600; padding: 16px 16px 4px; font-size: 17px; }
    .ios-alert-desc { font-size: 13px; padding: 0 16px 16px; color: #8e8e93; }
    .ios-alert-btn { border-top: 0.5px solid var(--border-color); padding: 12px; font-color: #007aff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div id="calc-app">
    <div class="calc-screen" id="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn top" onclick="calcInput('C')">AC</button>
      <button class="calc-btn top">±</button>
      <button class="calc-btn top">%</button>
      <button class="calc-btn op">÷</button>
      <button class="calc-btn" onclick="calcInput('7')">7</button>
      <button class="calc-btn" onclick="calcInput('8')">8</button>
      <button class="calc-btn" onclick="calcInput('9')">9</button>
      <button class="calc-btn op">×</button>
      <button class="calc-btn" onclick="calcInput('4')">4</button>
      <button class="calc-btn" onclick="calcInput('5')">5</button>
      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn op">-</button>
      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>
      <button class="calc-btn op">+</button>
      <button class="calc-btn zero" onclick="calcInput('0')">0</button>
      <button class="calc-btn" onclick="calcInput('.')">.</button>
      <button class="calc-btn op" onclick="checkPassword()">=</button>
    </div>
  </div>

  <div id="chat-app">
    <div class="header">
      <span style="font-size: 20px;">‹</span>
      <div>
        <div id="chat-title">文件传输助手</div>
        <div class="status-subtitle" id="status-sub"></div>
      </div>
      <span>•••</span>
    </div>

    <div class="chat-body" id="chat-body">
      <div class="system-msg">已进入加密通信频道</div>
    </div>

    <div class="input-bar">
      <button class="icon-btn" onclick="document.getElementById('file-input').click()">🖼️</button>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendImage(this)" />
      <input type="text" class="input-box" id="msg-input" placeholder="发送消息..." onkeypress="handleKeyPress(event)" />
      <button class="icon-btn" onclick="toggleEmoji()">😊</button>
      <button class="icon-btn" onclick="sendText()" style="font-size: 16px; font-weight:600; color:#07c160;">发送</button>
    </div>

    <div id="emoji-panel"></div>
  </div>

  <div id="context-menu" onclick="revokeMessage()">撤回</div>

  <div class="modal-overlay" id="update-modal">
    <div class="ios-alert">
      <div class="ios-alert-title">系统更新提示</div>
      <div class="ios-alert-desc" id="update-desc">检测到新版本组件需更新，请及时处理。</div>
      <div class="ios-alert-btn" onclick="closeModal()">确定</div>
    </div>
  </div>

  <script>
    let calcVal = "";
    let activeMsgElement = null;
    let longPressTimer = null;

    // --- 1. 密码验证逻辑 ---
    function calcInput(val) {
      if (val === 'C') { calcVal = ""; } 
      else { calcVal += val; }
      document.getElementById('calc-display').innerText = calcVal || "0";
    }

    function checkPassword() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const currentPassword = hours + mins; // 例如 21:30 -> 2130

      if (calcVal === currentPassword) {
        document.getElementById('calc-app').style.display = 'none';
        document.getElementById('chat-app').style.display = 'flex';
        initChat();
      } else {
        try { document.getElementById('calc-display').innerText = eval(calcVal.replace(/×/g, '*').replace(/÷/g, '/')) || "0"; } 
        catch { document.getElementById('calc-display').innerText = "Error"; }
        calcVal = "";
      }
    }

    // --- 2. 初始化与自动护眼模式 ---
    function initChat() {
      checkDarkMode();
      setInterval(checkDarkMode, 60000); // 每一分钟检查一次时间
      initEmojis();
    }

    function checkDarkMode() {
      const hour = new Date().getHours();
      // 19:00 到 06:00 自动开启夜间护眼模式
      if (hour >= 19 || hour < 6) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }

    // --- 3. 消息收发与长按撤回 ---
    function sendText() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      
      appendMessage(text, 'me');
      input.value = '';
      triggerAutoReply();
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendText(); }

    function sendImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgHtml = `<img src="${e.target.result}" />`;
          appendMessage(imgHtml, 'me', true);
          triggerAutoReply();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function appendMessage(content, sender, isHtml = false) {
      const body = document.getElementById('chat-body');
      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.style.backgroundImage = sender === 'me' 
        ? "url('https://api.dicebear.com/7.x/bottts/svg?seed=Me')" 
        : "url('https://api.dicebear.com/7.x/bottts/svg?seed=Other')";

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (isHtml) bubble.innerHTML = content;
      else bubble.innerText = content;

      // 绑定长按事件
      bindLongPress(bubble, row);

      row.appendChild(avatar);
      row.appendChild(bubble);
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    function bindLongPress(element, rowElement) {
      const start = (e) => {
        longPressTimer = setTimeout(() => {
          activeMsgElement = rowElement;
          showContextMenu(e);
        }, 600);
      };
      const cancel = () => clearTimeout(longPressTimer);

      element.addEventListener('touchstart', start);
      element.addEventListener('touchend', cancel);
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', cancel);
    }

    function showContextMenu(e) {
      const menu = document.getElementById('context-menu');
      const touch = e.touches ? e.touches[0] : e;
      menu.style.left = `${touch.clientX}px`;
      menu.style.top = `${touch.clientY - 30}px`;
      menu.style.display = 'block';
    }

    document.addEventListener('click', () => {
      document.getElementById('context-menu').style.display = 'none';
    });

    function revokeMessage() {
      if (activeMsgElement) {
        const sysMsg = document.createElement('div');
        sysMsg.className = 'system-msg';
        sysMsg.innerText = activeMsgElement.classList.contains('me') ? "你撤回了一条消息" : "对方撤回了一条消息";
        activeMsgElement.replaceWith(sysMsg);
        activeMsgElement = null;
      }
    }

    // --- 4. 模拟对方回复与打字状态 ---
    function triggerAutoReply() {
      const sub = document.getElementById('status-sub');
      const replies = ["收到！", "稍等一下，正在处理", "好的", "[图片]", "最近怎么样？", "稍后回复你"];

      setTimeout(() => {
        sub.innerText = "对方正在输入...";
      }, 1000);

      setTimeout(() => {
        sub.innerText = "";
        const randomText = replies[Math.floor(Math.random() * replies.length)];
        appendMessage(randomText, 'other');
        
        // 概率触发假软件更新弹窗消息通知
        if (Math.random() > 0.5) {
          showUpdateModal("检测到未读消息同步异常，请完成版本校验。");
        }
      }, 3000);
    }

    // --- 5. 表情包面板 ---
    function initEmojis() {
      const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔'];
      const panel = document.getElementById('emoji-panel');
      emojis.forEach(e => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.innerText = e;
        span.onclick = () => {
          document.getElementById('msg-input').value += e;
        };
        panel.appendChild(span);
      });
    }

    function toggleEmoji() {
      const panel = document.getElementById('emoji-panel');
      panel.style.display = panel.style.display === 'grid' ? 'none' : 'grid';
    }

    // --- 6. 系统更新弹窗控制 ---
    function showUpdateModal(msg) {
      document.getElementById('update-desc').innerText = msg;
      document.getElementById('update-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('update-modal').style.display = 'none';
    }
  </script>
</body>
</html>
